# Keeps the free-tier stream Space awake (HF pauses a Space after 48 h with no requests)
# and records whether the broadcast is live. Runs every 10 minutes.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping /health
        run: |
          out=$(curl -s --max-time 30 https://kalamishere-hisia-stream.hf.space/health || echo '{"live":"unreachable"}')
          echo "$out"
          echo "$out" | grep -q '"live":true' || { echo "::warning::stream not live: $out"; }
