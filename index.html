<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hisia · World Sound</title>
<link rel="icon" href="icons/sun-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/sun-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/sun-180.png">
<link rel="shortcut icon" href="icons/sun.ico">
<meta name="theme-color" content="#0a1020">
<meta name="description" content="Continuous radio of AI-generated mirrors of the world's charts. Follows the sun.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --text:"Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --horizon:62%;
  --ink:#fff;
  --ink-soft:rgba(255,255,255,.72);
  --ink-faint:rgba(255,255,255,.5);
  --scrim:rgba(6,8,18,.34);
  --star-op:0;
  --cloud-op:.5;
  --sun-x:50%;
  --sun-y:30%;
  --sun-op:1;
  --sun-core:#fff4d8;
  --sun-glow-c:rgb(255,214,140);
  --hz:rgba(255,255,255,.28);
  --sun-scale:1;
  --sodium-op:0;
  --moon-x:50%;
  --moon-y:30%;
  --pad:clamp(20px, 4.2vw, 84px);
  color-scheme:dark;
}
/* the sun, moon, light and colours glide between cities instead of snapping (Kalam, 2026-09-07);
   registered properties interpolate on :root, so every gradient that reads them follows */
@property --sun-x{syntax:'<percentage>';inherits:true;initial-value:50%}
@property --sun-y{syntax:'<percentage>';inherits:true;initial-value:30%}
@property --moon-x{syntax:'<percentage>';inherits:true;initial-value:50%}
@property --moon-y{syntax:'<percentage>';inherits:true;initial-value:30%}
@property --sun-scale{syntax:'<number>';inherits:true;initial-value:1}
@property --sodium-op{syntax:'<number>';inherits:true;initial-value:0}
@property --sun-glow-c{syntax:'<color>';inherits:true;initial-value:rgb(255,214,140)}
@property --sun-core{syntax:'<color>';inherits:true;initial-value:#fff4d8}
@property --hz{syntax:'<color>';inherits:true;initial-value:rgba(255,255,255,.28)}
:root{transition:--sun-x 2.4s ease,--sun-y 2.4s ease,--moon-x 2.4s ease,--moon-y 2.4s ease,--sun-scale 2.4s ease,
      --sodium-op 2.4s ease,--sun-glow-c 2.4s ease,--sun-core 2.4s ease,--hz 2.4s ease}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#0a1020;color:var(--ink);
  font-family:var(--text);font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#stage{position:fixed;inset:0;overflow:hidden}

/* ---------- sky ---------- */
.sky{position:absolute;inset:0;transition:opacity 1.6s ease}
.sky.b{opacity:0}
.ground{position:absolute;left:0;right:0;top:var(--horizon);bottom:0}
#seaGlow{
  position:absolute;left:0;right:0;top:var(--horizon);height:16vh;
  background:radial-gradient(46vw 16vh at var(--sun-x) 0%, color-mix(in srgb,var(--sun-glow-c) 50%,transparent), color-mix(in srgb,var(--sun-glow-c) 0%,transparent) 72%);
  mix-blend-mode:screen;opacity:var(--sun-op);pointer-events:none;
  transition:opacity 1.6s ease;
}
.ground.b{opacity:0;transition:opacity 1.6s ease}
#groundWrap{position:absolute;inset:0;z-index:1}
.horizonline{
  position:absolute;left:0;right:0;top:var(--horizon);height:1px;
  background:linear-gradient(90deg,transparent,var(--hz,rgba(255,255,255,.28)) 18%,var(--hz,rgba(255,255,255,.28)) 82%,transparent);
  opacity:.8;
}
/* soft glow sitting on the horizon under the sun */
#horizonGlow{
  position:absolute;left:0;right:0;top:calc(var(--horizon) - 30vh);height:34vh;
  background:radial-gradient(60vw 30vh at var(--sun-x) 100%, color-mix(in srgb,var(--sun-glow-c) 55%,transparent), color-mix(in srgb,var(--sun-glow-c) 0%,transparent) 70%);
  opacity:var(--sun-op);pointer-events:none;
  transition:opacity 1.6s ease;
}
/* moon: real phase and sky position for the playing city */
#moon{position:absolute;left:var(--moon-x,50%);top:var(--moon-y,30%);z-index:0;width:clamp(26px,2.6vw,48px);aspect-ratio:1;
  transform:translate(-50%,-50%);opacity:var(--moon-op,0);transition:opacity 2.4s ease;pointer-events:none;
  filter:drop-shadow(0 0 14px rgba(210,220,250,.35))}
#moon svg{width:100%;height:100%;display:block}
/* shooting stars */
#stars b{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.75);
  opacity:0;animation:shoot var(--dur,1.1s) ease-out forwards}
#stars b::before{content:"";position:absolute;right:0;top:0;height:2px;width:var(--len,90px);transform-origin:right center;
  transform:rotate(var(--ang));background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7))}
@keyframes shoot{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
/* sun */
#sun{
  position:absolute;left:var(--sun-x);top:var(--sun-y);z-index:0;
  width:clamp(74px,7.6vw,150px);aspect-ratio:1;margin:0 0 0 0;
  transform:translate(-50%,-50%);
  opacity:var(--sun-op);transition:opacity 2.4s ease;
  will-change:transform;
}
#sun::before{ /* glow */
  content:"";position:absolute;inset:-140%;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb,var(--sun-glow-c) 55%,transparent) 0%, color-mix(in srgb,var(--sun-glow-c) 22%,transparent) 34%, color-mix(in srgb,var(--sun-glow-c) 0%,transparent) 68%);
}
#sun::after{ /* disc */
  content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 45%, #fff 0%, var(--sun-core) 52%, color-mix(in srgb,var(--sun-glow-c) 92%,transparent) 100%);
  box-shadow:0 0 60px 12px color-mix(in srgb,var(--sun-glow-c) 35%,transparent);
}
/* ---- sky variants (?sky=sodium | mirror), after Eliasson's Weather Project: one colour of light,
   a half sun completed by its mirror image, haze with body. Inert without a body.sky-* class. ---- */
#sodium{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:var(--sodium-op,0);transition:opacity 2.4s ease;
  background:#f0a53a;mix-blend-mode:color}
#sodium2{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:calc(var(--sodium-op,0) * .28);transition:opacity 2.4s ease;
  background:#c8781a;mix-blend-mode:multiply}
#sunMirror{display:none;position:absolute;left:var(--sun-x);top:var(--horizon);z-index:1;
  width:calc(clamp(74px,7.6vw,150px) * var(--sun-scale,1));aspect-ratio:1;transform:translate(-50%,-50%) scaleY(-1);
  border-radius:50%;background:radial-gradient(circle at 50% 45%, #fff 0%, var(--sun-core) 52%, color-mix(in srgb,var(--sun-glow-c) 92%,transparent) 100%);
  opacity:calc(var(--sun-op) * var(--mirror-op,0));filter:blur(1.5px);pointer-events:none;
  -webkit-mask-image:linear-gradient(0deg,rgba(0,0,0,.9) 50%,rgba(0,0,0,.05) 100%);mask-image:linear-gradient(0deg,rgba(0,0,0,.9) 50%,rgba(0,0,0,.05) 100%)}
#sunMirror::before{content:"";position:absolute;inset:-120%;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb,var(--sun-glow-c) 50%,transparent) 0%, color-mix(in srgb,var(--sun-glow-c) 18%,transparent) 36%, color-mix(in srgb,var(--sun-glow-c) 0%,transparent) 68%)}
.haze{display:none;position:absolute;left:-10%;width:120%;height:9vh;z-index:0;pointer-events:none;
  background:radial-gradient(62vw 100% at var(--sun-x) 50%, color-mix(in srgb,var(--sun-glow-c) 42%,transparent), color-mix(in srgb,var(--sun-glow-c) 0%,transparent) 72%);
  filter:blur(16px);mix-blend-mode:screen;opacity:calc(var(--sun-op) * var(--haze-op,0));animation:drift 40s linear infinite alternate}
.haze.h1{top:calc(var(--horizon) - 14vh);animation-duration:52s}
.haze.h2{top:calc(var(--horizon) - 6vh);height:12vh;animation-direction:reverse;animation-duration:64s}
.haze.h3{top:calc(var(--horizon) + 1vh);height:7vh;animation-duration:44s;opacity:calc(var(--sun-op) * var(--haze-op,0) * .6)}
body.sky-sodium #sun, body.sky-mirror #sun{width:calc(clamp(74px,7.6vw,150px) * var(--sun-scale,1))}
body.sky-mirror #sunMirror, body.sky-mirror .haze{display:block}
/* reflection column on the water/plain */
#reflection{
  position:absolute;left:var(--sun-x);top:var(--horizon);bottom:0;
  width:clamp(140px,16vw,330px);transform:translateX(-50%);
  background:radial-gradient(ellipse 42% 96% at 50% 0%, color-mix(in srgb,var(--sun-glow-c) 50%,transparent) 0%, color-mix(in srgb,var(--sun-glow-c) 16%,transparent) 45%, color-mix(in srgb,var(--sun-glow-c) 0%,transparent) 100%);
  filter:blur(18px);opacity:var(--sun-op);mix-blend-mode:screen;pointer-events:none;
  transition:opacity 1.6s ease;
}
/* gentle water lines */
.wave{
  position:absolute;left:-10%;width:120%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  animation:drift 26s linear infinite;opacity:.5;
}
.wave:nth-of-type(1){top:calc(var(--horizon) + 3.2vh);animation-duration:34s}
.wave:nth-of-type(2){top:calc(var(--horizon) + 7vh);animation-duration:46s;animation-direction:reverse;opacity:.34}
.wave:nth-of-type(3){top:calc(var(--horizon) + 12.5vh);animation-duration:60s;opacity:.22}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}

/* clouds */
.cloud{
  position:absolute;border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,255,255,.9), rgba(255,255,255,.35) 60%, rgba(255,255,255,0) 100%);
  filter:blur(14px);opacity:var(--cloud-op);
  transition:opacity 1.6s ease;
  will-change:transform;
}
.cloud.c1{width:44vw;height:9vh;top:18%;left:-50vw;animation:cross 210s linear infinite}
.cloud.c2{width:30vw;height:6vh;top:31%;left:-40vw;animation:cross 320s linear infinite;animation-delay:-90s;opacity:calc(var(--cloud-op) * .7)}
.cloud.c3{width:56vw;height:7vh;top:44%;left:-60vw;animation:cross 420s linear infinite;animation-delay:-180s;opacity:calc(var(--cloud-op) * .5)}
@keyframes cross{from{transform:translateX(0)}to{transform:translateX(180vw)}}

/* stars */
#stars{position:absolute;inset:0 0 38% 0;opacity:var(--star-op);transition:opacity 2.4s ease;pointer-events:none}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
  animation:twinkle 6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.95}}

/* birds */
.bird{position:absolute;left:-8vw;opacity:0;will-change:transform;pointer-events:none}
.bird svg{display:block;overflow:visible}
.bird path{fill:none;stroke:rgba(20,18,30,.55);stroke-width:1.6;stroke-linecap:round}
.bird.b1{top:26%;animation:fly 31s linear infinite}
.bird.b2{top:33%;animation:fly 43s linear infinite;animation-delay:-15s;transform:scale(.72)}
@keyframes fly{
  0%{transform:translate(0,0);opacity:0}
  4%{opacity:.55}
  22%{transform:translate(58vw,-3vh);opacity:.55}
  38%{transform:translate(118vw,1vh);opacity:0}
  100%{transform:translate(118vw,1vh);opacity:0}
}
@media (prefers-reduced-motion: reduce){
  .cloud,.bird,.wave,#stars i,#stars b{animation:none!important}
  .bird{opacity:0}
  :root{transition:none}
}

/* ---------- chrome ---------- */
#veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(6,8,18,.28) 0%,rgba(6,8,18,0) 22%,rgba(6,8,18,0) 52%,rgba(6,8,18,.34) 76%,rgba(6,8,18,.62) 100%);pointer-events:none}

header{
  position:absolute;top:0;left:0;right:0;z-index:2;padding:calc(var(--pad) * .72) var(--pad);
  display:flex;justify-content:space-between;align-items:baseline;gap:24px;
}
.mark{
  font-family:var(--text);font-weight:400;
  font-size:clamp(11px,.86vw,16px);letter-spacing:.28em;text-transform:uppercase;
  color:var(--ink-soft);
}
.nextcity{
  font-size:clamp(11px,.82vw,15px);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);text-align:right;
}
.nextcity b{font-weight:400;color:var(--ink-soft)}

#card{
  position:absolute;left:var(--pad);bottom:calc(var(--pad) * 1.15);z-index:2;
  max-width:min(56ch,62vw);
}
/* Embed only. On the full page there is sky above and below the card and it
   reads fine (Kalam, 10 Sep: "that's only on the embed - its fine on the
   website"). In a 360px-tall frame the same text lands on the horizon band,
   which in daylight is the brightest thing on screen — so the embed gets a
   soft scrim behind the card and a light shadow on the type. */
body.embed #card{text-shadow:0 1px 10px rgba(4,6,14,.55)}
body.embed #card::before{
  content:"";position:absolute;inset:-1em -2.4em -1em -1.6em;z-index:-1;
  pointer-events:none;border-radius:18px;
  background:radial-gradient(118% 94% at 6% 55%, rgba(4,6,14,.52), rgba(4,6,14,.3) 44%, rgba(4,6,14,0) 78%);
}
body.embed #promptBox:not([hidden]){text-shadow:none}
.city{
  font-family:var(--display);font-weight:400;
  font-size:clamp(38px,4.6vw,92px);line-height:1.02;letter-spacing:-.01em;
  margin:0 0 .18em;text-shadow:0 2px 30px rgba(4,6,16,.45);
}
.city.long{font-size:clamp(30px,3.5vw,70px)}
.city .time{opacity:.62;font-style:italic}
.country{
  display:block;font-family:var(--text);font-size:clamp(10px,.78vw,14px);
  letter-spacing:.26em;text-transform:uppercase;color:var(--ink-faint);
  margin-bottom:1.1em;
}
.track{
  font-size:clamp(16px,1.35vw,27px);font-weight:400;line-height:1.35;margin:0 0 .5em;
  color:var(--ink);
}
.track .artist{opacity:.82}
.track .sep{opacity:.4;padding:0 .35em}
.track .title{font-family:var(--display);font-size:1.12em}
/* when a long name pushes the card up into the strip: first widen and shrink the track line, then the city, and only then lift the strip */
#card.tight1{max-width:min(72ch,78vw)}
#card.tight1 .track{font-size:clamp(14px,1.1vw,22px)}
#card.tight2{max-width:min(80ch,84vw)}
#card.tight2 .track{font-size:clamp(13px,.95vw,19px)}
#card.tight2 .city{font-size:clamp(30px,3.6vw,72px)}
.meta{font-size:clamp(12px,.92vw,18px);color:var(--ink-soft);line-height:1.6;margin:0}
.meta .genre{letter-spacing:.02em}
.readout{color:var(--ink-faint)}
.honest{
  margin:.85em 0 0;font-size:clamp(10.5px,.76vw,14px);letter-spacing:.06em;
  color:rgba(255,255,255,.44);line-height:1.6;max-width:52ch;
}
#promptBox{
  margin-top:1em;padding:.85em 1em;border-left:2px solid rgba(255,255,255,.28);
  background:rgba(6,8,18,.34);backdrop-filter:blur(6px);
  font-size:clamp(11px,.8vw,15px);line-height:1.6;color:var(--ink-soft);
  max-width:64ch;
}
#promptBox .lab{display:flex;align-items:center;gap:.8em;font-size:.82em;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.5em}
#btnCopy{font:inherit;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:.15em .7em;cursor:pointer}
#btnCopy:hover{background:rgba(255,255,255,.16)} #btnCopy.done{color:#0a1020;background:#f0a53a;border-color:#f0a53a}
body.stream #btnCopy{display:none}
[hidden]{display:none!important}

/* progress */
#progressWrap{
  position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--pad) * .62);
  height:1px;background:rgba(255,255,255,.16);
}
#progress{height:100%;width:0;background:rgba(255,255,255,.85);transform-origin:left}

/* controls */
#controls{
  position:absolute;right:var(--pad);bottom:calc(var(--pad) * 1.15);z-index:2;
  display:flex;align-items:center;gap:clamp(10px,1vw,18px);
}
button.ctl{
  appearance:none;border:1px solid rgba(255,255,255,.3);background:rgba(6,8,18,.28);
  backdrop-filter:blur(6px);color:var(--ink);border-radius:999px;
  font-family:var(--text);font-size:clamp(10px,.74vw,13px);letter-spacing:.18em;text-transform:uppercase;
  padding:.72em 1.1em;cursor:pointer;transition:background .2s,border-color .2s,opacity .2s;
  white-space:nowrap;
}
button.ctl:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.5)}
button.ctl:focus-visible{outline:2px solid rgba(255,255,255,.75);outline-offset:2px}
button.ctl.icon{width:2.9em;height:2.9em;padding:0;display:grid;place-items:center;font-size:clamp(11px,.8vw,15px)}
/* what plays next: both orders visible at once, the active one filled, so the
   label reads as a choice between two and not as a button that turns one on */
.seg{
  display:inline-flex;align-items:stretch;border:1px solid rgba(255,255,255,.3);
  background:rgba(6,8,18,.28);backdrop-filter:blur(6px);border-radius:999px;padding:2px;
}
button.seg-opt{
  appearance:none;border:0;background:transparent;color:var(--ink);opacity:.55;
  border-radius:999px;font-family:var(--text);font-size:clamp(10px,.74vw,13px);
  letter-spacing:.18em;text-transform:uppercase;padding:.62em 1em;cursor:pointer;
  white-space:nowrap;transition:background .2s,opacity .2s;
}
button.seg-opt:hover{opacity:.85}
button.seg-opt[aria-pressed="true"]{background:rgba(255,255,255,.18);opacity:1;cursor:default}
button.seg-opt:focus-visible{outline:2px solid rgba(255,255,255,.75);outline-offset:2px}
button.ctl.icon svg{width:1.25em;height:1.25em;fill:currentColor;display:block}
#vol{
  -webkit-appearance:none;appearance:none;width:clamp(64px,7vw,120px);height:2px;
  background:rgba(255,255,255,.28);border-radius:2px;cursor:pointer;
}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;cursor:pointer}
#vol::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#fff;cursor:pointer}

footer{
  position:absolute;left:var(--pad);bottom:calc(var(--pad) * .2);z-index:2;
  font-size:clamp(10px,.72vw,13px);letter-spacing:.16em;color:rgba(255,255,255,.38);
}
footer a{color:rgba(255,255,255,.6);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25)}
footer a:hover{color:#fff}

/* city strip along the horizon: every city in order of local time, lit by how close it is to evening */
#strip{
  position:absolute;left:var(--pad);right:var(--pad);top:calc(var(--horizon) - 3.2vh);
  display:flex;justify-content:center;gap:clamp(.9em,1.4vw,1.6em);overflow:hidden;
  font-size:clamp(9px,.62vw,12px);letter-spacing:.12em;text-transform:uppercase;
  color:#fff;pointer-events:none;white-space:nowrap;z-index:2;
  /* the list is rotated so the playing city sits in the middle; the edges fade out midday and 3 a.m. */
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
}
#strip span{flex:0 0 auto}
#strip span{opacity:.22;transition:opacity 1.2s}
#strip span i{font-style:normal;opacity:.7;margin-left:.45em;letter-spacing:.06em}
#strip span.on{opacity:1;text-shadow:0 0 12px rgba(255,220,160,.6)}
@media(max-width:820px){
  #strip{display:none}
  .nextcity .pre{display:none}                       /* "following the sun ·" is implied on a phone */
  #card{bottom:calc(var(--pad) * .2 + 8.4em + env(safe-area-inset-bottom));max-width:calc(100vw - 2 * var(--pad))}
  #controls{left:var(--pad);right:var(--pad);bottom:calc(var(--pad) * .2 + 4.2em + env(safe-area-inset-bottom));justify-content:flex-start;flex-wrap:wrap}
  .nextcity{white-space:nowrap}
  footer{bottom:calc(var(--pad) * .2 + env(safe-area-inset-bottom));font-size:10px;letter-spacing:.1em}
  #promptBox:not([hidden]){max-height:28vh;overflow:auto}
}
@media(pointer:coarse){#vol{display:none}}          /* hardware volume on phones; the slider does nothing */

/* on a wide screen the prompt takes its own column on the right, above the controls, so the card never
   grows into the horizon strip; the stream frame has no controls, so its column sits lower */
@media (min-width:860px){
  #promptBox:not([hidden]){position:fixed;left:auto;right:var(--pad);bottom:calc(var(--pad) * 1.15 + 4.6em);width:min(46ch,34vw);max-width:none;margin:0;z-index:2}
  body.stream #promptBox:not([hidden]){bottom:calc(var(--pad) * 1.15)}
}
/* between the phone rules and that column the prompt sits in the card's flow,
   where a short frame (a 640x360 embed) let it grow into the controls - cap it
   and let it scroll instead (Kalam, 10 Sep, on the Zinstrel embed) */
@media (min-width:761px) and (max-width:859px){
  #promptBox:not([hidden]){max-height:30vh;overflow:auto}
}

/* An embed in a short frame (Marcus's 640x360 listing card) cannot fit the
   wordmark, city, track, readout, provenance, prompt AND controls at full
   size. The card is bottom-anchored, so anything that does not fit pushes the
   city off the top — which is exactly what happened (Kalam, 10 Sep: "it's
   worse?"). In that frame: drop the wordmark (the host page has its own
   title), drop the readout line (the prompt repeats its numbers), shrink the
   type, and cap the prompt so it scrolls instead of growing. */

     column, the prompt in a right column, controls along the bottom. Stacking
     them the way the full-height page does crams everything into the top-left
     and leaves the right half dead (Kalam, 10 Sep: "cramped on the top left and
     ugly"). The wordmark, city strip, readout line and footer go — the host
     page has its own title, and the prompt repeats the readout's numbers. */

  body.embed #strip{display:none}
  body.embed footer{display:none}
  body.embed .readout{display:none}

  body.embed .city{font-size:clamp(20px,6.4vh,30px);line-height:1.05}
  body.embed .country{font-size:8.5px;letter-spacing:.2em;margin-bottom:.45em}
  body.embed .track{font-size:clamp(12px,3vh,15px);line-height:1.3;margin-bottom:.3em}
  body.embed .meta{font-size:10.5px;line-height:1.45}
  body.embed .honest{font-size:9px;margin-top:.4em;line-height:1.45;max-width:none}

  body.embed #promptBox:not([hidden]){
    position:fixed;left:auto;right:var(--pad);top:calc(var(--pad) + 1.4em);
    bottom:calc(var(--pad) + 3.1em);width:min(46%,44ch);margin:0;z-index:2;
    font-size:10.5px;line-height:1.55;padding:.7em .85em;

  }

  body.embed #vol{width:clamp(40px,8vw,70px)}

   ROOMY in the script). Opened by hand it stacks under the card and scrolls,
   capped so it can never reach the controls. */

  body.embed #card{width:auto;right:var(--pad);bottom:calc(var(--pad) + 3.1em)}

<script>

var RAD = Math.PI/180, J1970 = 2440588, J2000 = 2451545, OBL = RAD*23.4397;

  var root = document.documentElement.style, v = SKY_VALS[phase] || SKY_VALS.day, on = (SKY === "sodium" || SKY === "mirror" || SKY === "blend");

/* sunrise/sunset as local hours for the playing city; fixed fallback if the maths gives up */
function sunHours(iso, tz){
  var c = COORDS[iso], st = c && sunTimes(now(), c[0], c[1]);

function phaseFor(h, sh){
  var rise = sh ? sh.rise : 6.2, set = sh ? sh.set : 19.6;
  if (h < rise - 1.1 || h >= set + 1.5) return "night";

    c[1]+" 32%,"+c[1]+" 40%,"+

    c[3]+" 66%,"+c[3]+" 70%,"+

/* sun position from the playing city's local hour */

  var SUNRISE = sh ? sh.rise : 6.2, SUNSET = sh ? sh.set : 19.6;
  var root = document.documentElement.style, up = (h > SUNRISE && h < SUNSET);
  var t = (h - SUNRISE) / (SUNSET - SUNRISE);
  var x = 14 + 72 * Math.min(1, Math.max(0, t));
  var horizon = 62, top = 11;
  var elev = up ? Math.sin(Math.PI * t) : 0;

  var y = horizon - elev * (horizon - top);

  if (!all.length) return null;
  if (forcedCity && poolByRegion[forcedCity]){ var f = forcedCity; forcedCity = null; return f; }
  var hold = Math.min(recent.length, Math.max(0, all.length - 1));
  var skip = recent.slice(recent.length - hold);
  var cands = all.filter(function(k){ return skip.indexOf(k) === -1; });
  if (!cands.length) cands = all;
  /* any city within 3.5 h of evening, at random — strict "closest" looped four
     cities for half an hour; this spreads an hour across ten */

  cands.forEach(function(k){
    score[k] = eveningness(regionsByIso[k].tz, d);
    jitter[k] = Math.random();

     about three times as often as one already two hours into the night */
  var near = cands.filter(function(k){ return score[k] <= 3.5; });
  /* a thin side of the clock (the Americas at this hour) leaves too few cities in the
     window and the pool repeats; take the six nearest to evening instead */
  if (near.length < 6){ near = cands.slice().sort(function(a,b){ return score[a] - score[b]; }).slice(0, 6); }
  if (near.length){
    var w = near.map(function(k){ var dd = Math.abs(localHour(regionsByIso[k].tz, d) - 19.5); dd = Math.min(dd, 24 - dd); return 1 / (0.5 + dd); });
    var total = w.reduce(function(a,b){ return a + b; }, 0), pick = Math.random() * total;
    for (var i = 0; i < near.length; i++){ pick -= w[i]; if (pick <= 0) return near[i]; }
    return near[near.length - 1];

function pickDrift(from){
  if (!from || !from.nearest5 || !from.nearest5.length) return null;
  var skip = recent.slice(Math.max(0, recent.length - 3));
  for (var i = 0; i < from.nearest5.length; i++){
    var t = trackById[from.nearest5[i]];
    if (!t || !poolByRegion[t.region]) continue;
    if (t.region === from.region || skip.indexOf(t.region) !== -1) continue;
    if (playedByRegion[t.region].indexOf(t.id) !== -1) continue;
    return t;
  }

}

function refill(){
  var guard = 0;

      var near = pickDrift(from);
      if (near){
        near.by = "sound";
        playedByRegion[near.region].push(near.id); queue.push(near);
        lastRegion = near.region;
        recent.push(near.region);
        if (recent.length > 4) recent.shift();
        continue;

    if (!iso) break;
    var pool = poolByRegion[iso], played = playedByRegion[iso];
    var fresh = pool.filter(function(t){ return played.indexOf(t.id) === -1; });
    if (!fresh.length){ played.length = 0; fresh = pool.slice(); }
    shuffle(fresh);
    var take = fresh.slice(0, Math.min(RUN, fresh.length));
    take.forEach(function(t){ t.by = "sun"; played.push(t.id); queue.push(t); });

var ctx = null, master = null, players = [], active = 0;
var current = null, upcoming = null, fading = false, muted = false, wantPlay = false;
var XFADE = 2.0;

            new URLSearchParams(location.search).has("plain");   /* ?plain=1 tries the iPhone path on a desktop */

function makePlayer(){

  el.loop = false;
  el.setAttribute("playsinline", "");

  el.crossOrigin = "anonymous";
  var gain = ctx.createGain();
  gain.gain.value = 0;
  var src = ctx.createMediaElementSource(el);
  src.connect(gain); gain.connect(master);
  return {el:el, gain:gain, src:src, track:null};

function initAudio(){
  if (ctx) return;

  else {
    var AC = window.AudioContext || window.webkitAudioContext;

    master.connect(ctx.destination);

  players.forEach(function(p){

/* equal-power curves, computed once */
var CURVE_UP = new Float32Array(64), CURVE_DOWN = new Float32Array(64);
for (var i=0;i<64;i++){
  var x = i/63;
  CURVE_UP[i] = Math.cos((1-x) * Math.PI/2);
  CURVE_DOWN[i] = Math.cos(x * Math.PI/2);
}

function preloadNext(){
  if (!queue.length) refill();

    other.track = upcoming;
    other.el.src = upcoming.file;
    try { other.el.load(); } catch(e){}
  }

function startTrack(track, fade){
  var p = players[active];

  p.el.currentTime = 0;

  else if (fade){

  } else if (immediate){
    outgoing.gain.gain.setValueCurveAtTime(CURVE_DOWN, t, 0.35);
    setTimeout(function(){ try{ outgoing.el.pause(); }catch(e){} }, 420);
  } else {
    outgoing.gain.gain.setValueCurveAtTime(CURVE_DOWN, t, XFADE);
    setTimeout(function(){ try{ outgoing.el.pause(); }catch(e){} }, (XFADE+0.15)*1000);

/* tags the mood/instrument models hand to nearly every chart on earth ("love", "happy",
   "bass", "drums") say nothing about a city; show what this city has that most don't */
var tagShare = null;
function tagShares(){
  if (tagShare) return tagShare;
  var n = 0, count = {};
  Object.keys(regionsByIso).forEach(function(k){
    var ro = regionsByIso[k].readout || {}; n++;
    (ro.instruments || []).concat(ro.moods || []).forEach(function(t){ count[t] = (count[t] || 0) + 1; });
  });

  return tagShare;
}

  var sorted = (tags || []).slice().sort(function(a, b){ return (share[a] || 0) - (share[b] || 0); });
  var rare = sorted.filter(function(t){ return (share[t] || 0) <= 0.5; });
  if (rare.length) return rare.slice(0, keep);

  return sorted.length && (share[sorted[0]] || 0) < 0.8 ? [sorted[0]] : [];

/* the words the track was actually made from: the prompt's instrument clauses and its feel,

function promptCut(p){
  var cl = String(p || "").split(/,\s*/).map(function(s){ return s.trim(); }).filter(Boolean);
  if (cl.length < 3) return "";
  var body = cl.slice(1).filter(function(c){ return !/\b(bpm|key|major|minor|instrumental)\b/i.test(c); });
  if (!body.length) return "";

  var out = inst.concat([feel]).join(", ");

  return out;
}

    if (inst.length) bits.push(inst.join(", "));
